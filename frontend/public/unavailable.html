<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartSkale InterviewBot — Temporarily Unavailable</title>
    <style>
      :root {
        --bg: #0f1c2e;
        --card: #162536;
        --text: #e8eef5;
        --muted: #9db0c4;
        --accent: #3d8fd1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1c3a57 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 100%, #243b55 0%, transparent 50%),
          var(--bg);
        padding: 1.5rem;
      }
      main {
        width: min(36rem, 100%);
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid rgba(157, 176, 196, 0.25);
        border-radius: 12px;
        padding: 2rem 1.75rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.4rem, 3vw, 1.85rem);
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .brand {
        margin: 0 0 1.25rem;
        color: var(--accent);
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      }
      a:hover { color: #7eb7e8; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">SmartSkale InterviewBot</p>
      <h1>Service temporarily unavailable</h1>
      <p>
        Our interview service is briefly offline. Please refresh in a moment.
        If this continues, try again later.
      </p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
