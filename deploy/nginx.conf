# AI Interview Bot — nginx site config for AWS EC2
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-interview-bot
# Enable:  sudo ln -sf /etc/nginx/sites-available/ai-interview-bot /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
# Test:    sudo nginx -t && sudo systemctl reload nginx
#
# Production TLS is managed by Certbot on the server; keep error_page +
# /unavailable.html when editing the live sites-available file.

server {
    listen 80;
    server_name _;

    root /var/www/ai-interview-bot/frontend/dist;
    index index.html;

    client_max_body_size 12M;

    # Branded downtime page for upstream/proxy failures (API/backend down).
    error_page 502 503 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/ai-interview-bot/frontend/dist;
        internal;
    }

    # React SPA — client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
    }

    # Backend health check (used by load balancers / monitoring)
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proctoring sub-app (face detection, warnings) — same origin as frontend
    location /proctor/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
    }
}
