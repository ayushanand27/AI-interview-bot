name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          # Settings() has no defaults for these — the test suite never talks
          # to a real DB/Groq, but importing app.core.config requires them.
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          GROQ_API_KEY: "ci-test-placeholder-key"
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Audit dependencies (moderate+)
        run: npm audit --audit-level=moderate
