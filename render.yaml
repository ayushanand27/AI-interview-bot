# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this GitHub repo in Render → New → Blueprint → select render.yaml
# Then set sync:false secrets in the Render dashboard (OPENAI_API_KEY, GROQ_API_KEY, SECRET_KEY, SMTP_*).

databases:
  - name: ai-interview-db
    plan: free
    databaseName: interview_bot
    user: interview_bot

services:
  # FastAPI backend (Docker — includes proctoring / OpenCV / MediaPipe)
  - type: web
    name: ai-interview-api
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: ai-interview-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ai-interview-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ai-interview-web
          envVarKey: RENDER_EXTERNAL_URL

  # React static frontend
  - type: web
    name: ai-interview-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-interview-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
